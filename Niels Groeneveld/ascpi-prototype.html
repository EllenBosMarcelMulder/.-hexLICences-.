<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCπ - Adaptive Structural Coherence π</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #f5f5f5;
            --accent: #ff6b35;
            --field: #007acc;
            --bg: #fafafa;
            --text: #2c2c2c;
            --monospace: 'Fira Code', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 400px 1fr;
            height: 100vh;
            gap: 1px;
            background: var(--primary);
        }

        .input-panel {
            background: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .field-panel {
            background: var(--secondary);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 30px;
            font-family: var(--monospace);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            flex: 1;
            min-height: 200px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-family: var(--monospace);
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--field);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #e55a2b;
            transform: translateY(-1px);
        }

        .field-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid var(--field);
        }

        .field-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .field-point {
            font-family: var(--monospace);
            font-size: 12px;
            color: #666;
            margin: 5px 0;
            word-break: break-all;
        }

        .svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #field-svg {
            max-width: 90%;
            max-height: 90%;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .coordinates {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: var(--monospace);
            font-size: 12px;
            color: #666;
            background: rgba(255,255,255,0.9);
            padding: 8px 12px;
            border-radius: 4px;
            backdrop-filter: blur(10px);
        }

        .hash-chain {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-family: var(--monospace);
            font-size: 11px;
            color: #666;
            overflow-wrap: break-word;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .processing {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-panel">
            <h1>ASCπ</h1>
            <div class="subtitle">Adaptive Structural Coherence π</div>
            
            <textarea id="input-text" placeholder="Enter text to analyze structurally...

Example:
The quick brown fox jumps over the lazy dog.
Mathematics reveals patterns in chaos.
π emerges from circular relationships.">The quick brown fox jumps over the lazy dog.
Mathematics reveals patterns in chaos.
π emerges from circular relationships.</textarea>

            <div class="controls">
                <button onclick="processText()">Generate Field</button>
                <button onclick="clearField()">Clear</button>
            </div>

            <div class="field-info" id="field-info" style="display: none;">
                <h3>Field Points Generated:</h3>
                <div id="field-points"></div>
                <div class="hash-chain">
                    <strong>Hash Chain:</strong>
                    <div id="hash-output"></div>
                </div>
            </div>
        </div>

        <div class="field-panel">
            <div class="svg-container">
                <svg id="field-svg" width="800" height="600" viewBox="0 0 800 600">
                    <defs>
                        <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#007acc;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.8" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge> 
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <text x="400" y="300" text-anchor="middle" fill="#ccc" font-size="18" font-family="monospace">
                        Field Visualization Area
                    </text>
                    <text x="400" y="325" text-anchor="middle" fill="#999" font-size="12" font-family="monospace">
                        Enter text and click "Generate Field" to see structural representation
                    </text>
                </svg>
            </div>
            <div class="coordinates" id="coordinates">
                Θ: 0° | Φ: 0° | Scale: 1.0
            </div>
        </div>
    </div>

    <script>
        // ASCπ Core Implementation
        class ASCpiParser {
            constructor() {
                this.hashChain = [];
                this.fieldPoints = [];
            }

            // Layer 1: Intake Parser - Convert text to field points
            parseText(text) {
                const segments = this.segmentText(text);
                this.fieldPoints = [];
                this.hashChain = [];

                segments.forEach((segment, index) => {
                    const fieldPoint = this.createFieldPoint(segment, index);
                    this.fieldPoints.push(fieldPoint);
                    this.updateHashChain(fieldPoint);
                });

                return this.fieldPoints;
            }

            segmentText(text) {
                // Simple segmentation: words and punctuation
                return text.match(/\S+/g) || [];
            }

            createFieldPoint(segment, index) {
                // Generate ⟨P,R,O,A,F,Ω⟩ parameters
                const P = index; // Position/index
                const R = segment.length; // Interval/duration (length)
                const O = this.getOrientation(segment); // Orientation (first chars)
                const A = Math.log(segment.length + 1) * 10; // Amplitude (log of length)
                const F = this.getFrequency(segment); // Frequency (character variation)
                const Ω = this.getRotation(segment); // Rotation axis/polarity

                return { P, R, O, A, F, Ω, text: segment };
            }

            getOrientation(segment) {
                // Use first 3 characters to determine orientation
                const chars = segment.substring(0, 3).toLowerCase();
                let angle = 0;
                for (let i = 0; i < chars.length; i++) {
                    angle += chars.charCodeAt(i) * (i + 1);
                }
                return (angle % 360);
            }

            getFrequency(segment) {
                // Character variation as frequency
                const chars = new Set(segment.toLowerCase());
                return (chars.size / segment.length) * 100;
            }

            getRotation(segment) {
                // Vowel/consonant ratio determines rotation direction
                const vowels = (segment.match(/[aeiou]/gi) || []).length;
                const consonants = segment.length - vowels;
                return vowels > consonants ? 1 : -1; // 1 = clockwise, -1 = counter-clockwise
            }

            updateHashChain(fieldPoint) {
                const serialized = JSON.stringify(fieldPoint);
                const hash = this.simpleHash(serialized + (this.hashChain[this.hashChain.length - 1] || ''));
                this.hashChain.push(hash);
            }

            simpleHash(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convert to 32-bit integer
                }
                return Math.abs(hash).toString(16).substring(0, 8);
            }
        }

        // Layer 2: ASCπ Motor - Field Evolution
        class ASCpiMotor {
            constructor() {
                this.theta = 0; // Phase
                this.kappa = 1; // Curvature/resistance
                this.coherence = 1;
                this.density = 1;
            }

            evolveField(fieldPoints) {
                return fieldPoints.map((point, index) => {
                    const evolved = { ...point };
                    
                    // Apply field evolution rules
                    evolved.P += Math.sin(this.theta + index) * 0.1;
                    evolved.O += this.theta * 0.5;
                    evolved.A *= (1 + Math.sin(this.theta * 0.1) * 0.1);
                    
                    return evolved;
                });
            }

            setPhase(theta) {
                this.theta = theta;
            }
        }

        // Layer 3: SVG Field Notation
        class ASCpiSVG {
            constructor(svgElement) {
                this.svg = svgElement;
                this.width = 800;
                this.height = 600;
                this.centerX = this.width / 2;
                this.centerY = this.height / 2;
            }

            renderField(fieldPoints) {
                // Clear existing content
                while (this.svg.firstChild && this.svg.firstChild.tagName !== 'defs') {
                    this.svg.removeChild(this.svg.firstChild);
                }

                // Render each field point as a swirl/spiral
                fieldPoints.forEach((point, index) => {
                    this.renderFieldPoint(point, index);
                });

                // Connect related points
                this.renderConnections(fieldPoints);
            }

            renderFieldPoint(point, index) {
                const { P, R, O, A, F, Ω } = point;
                
                // Map field parameters to SVG coordinates
                const x = this.centerX + (P * 60) % (this.width - 100) - (this.width - 100) / 2;
                const y = this.centerY + Math.sin(P * 0.5) * 100;
                
                // Create swirl path
                const pathData = this.createSwirlPath(x, y, A, O, R, Ω);
                
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathData);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", `hsl(${F * 3.6}, 70%, 50%)`);
                path.setAttribute("stroke-width", Math.max(1, A / 10));
                path.setAttribute("opacity", "0.8");
                path.setAttribute("filter", "url(#glow)");
                
                // Add animation
                const animate = document.createElementNS("http://www.w3.org/2000/svg", "animateTransform");
                animate.setAttribute("attributeName", "transform");
                animate.setAttribute("type", "rotate");
                animate.setAttribute("values", `0 ${x} ${y};${Ω * 360} ${x} ${y}`);
                animate.setAttribute("dur", `${5 + R}s`);
                animate.setAttribute("repeatCount", "indefinite");
                path.appendChild(animate);

                this.svg.appendChild(path);

                // Add text label
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x);
                text.setAttribute("y", y - A - 5);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("fill", "#666");
                text.setAttribute("font-size", "10");
                text.setAttribute("font-family", "monospace");
                text.textContent = point.text;
                this.svg.appendChild(text);
            }

            createSwirlPath(centerX, centerY, amplitude, orientation, radius, rotation) {
                let path = `M ${centerX} ${centerY}`;
                const steps = 20;
                const angleStep = (2 * Math.PI) / steps;
                
                for (let i = 1; i <= steps; i++) {
                    const angle = (orientation * Math.PI / 180) + (i * angleStep * rotation);
                    const r = (amplitude / 2) * (i / steps);
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    
                    if (i === 1) {
                        path += ` L ${x} ${y}`;
                    } else {
                        path += ` Q ${centerX + (r * 0.8) * Math.cos(angle - angleStep)} ${centerY + (r * 0.8) * Math.sin(angle - angleStep)} ${x} ${y}`;
                    }
                }
                
                return path;
            }

            renderConnections(fieldPoints) {
                for (let i = 0; i < fieldPoints.length - 1; i++) {
                    const point1 = fieldPoints[i];
                    const point2 = fieldPoints[i + 1];
                    
                    const x1 = this.centerX + (point1.P * 60) % (this.width - 100) - (this.width - 100) / 2;
                    const y1 = this.centerY + Math.sin(point1.P * 0.5) * 100;
                    const x2 = this.centerX + (point2.P * 60) % (this.width - 100) - (this.width - 100) / 2;
                    const y2 = this.centerY + Math.sin(point2.P * 0.5) * 100;
                    
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", x1);
                    line.setAttribute("y1", y1);
                    line.setAttribute("x2", x2);
                    line.setAttribute("y2", y2);
                    line.setAttribute("stroke", "#ddd");
                    line.setAttribute("stroke-width", "0.5");
                    line.setAttribute("opacity", "0.5");
                    
                    this.svg.appendChild(line);
                }
            }
        }

        // Global instances
        const parser = new ASCpiParser();
        const motor = new ASCpiMotor();
        const renderer = new ASCpiSVG(document.getElementById('field-svg'));

        // Main processing function
        function processText() {
            const text = document.getElementById('input-text').value.trim();
            if (!text) return;

            const container = document.querySelector('.container');
            container.classList.add('processing');

            setTimeout(() => {
                // Parse text into field points
                const fieldPoints = parser.parseText(text);
                
                // Evolve field through motor
                const evolvedField = motor.evolveField(fieldPoints);
                
                // Render to SVG
                renderer.renderField(evolvedField);
                
                // Update UI
                displayFieldInfo(fieldPoints, parser.hashChain);
                
                container.classList.remove('processing');
            }, 100);
        }

        function displayFieldInfo(fieldPoints, hashChain) {
            const fieldInfo = document.getElementById('field-info');
            const fieldPointsEl = document.getElementById('field-points');
            const hashOutput = document.getElementById('hash-output');

            let pointsHTML = '';
            fieldPoints.forEach((point, index) => {
                pointsHTML += `<div class="field-point">
                    ${index + 1}: ⟨P:${point.P.toFixed(1)}, R:${point.R}, O:${point.O.toFixed(1)}°, A:${point.A.toFixed(1)}, F:${point.F.toFixed(1)}, Ω:${point.Ω}⟩ "${point.text}"
                </div>`;
            });

            fieldPointsEl.innerHTML = pointsHTML;
            hashOutput.textContent = hashChain.join(' → ');
            fieldInfo.style.display = 'block';
        }

        function clearField() {
            document.getElementById('input-text').value = '';
            document.getElementById('field-info').style.display = 'none';
            
            const svg = document.getElementById('field-svg');
            while (svg.firstChild && svg.firstChild.tagName !== 'defs') {
                svg.removeChild(svg.firstChild);
            }
            
            // Restore placeholder text
            const placeholder = document.createElementNS("http://www.w3.org/2000/svg", "text");
            placeholder.setAttribute("x", "400");
            placeholder.setAttribute("y", "300");
            placeholder.setAttribute("text-anchor", "middle");
            placeholder.setAttribute("fill", "#ccc");
            placeholder.setAttribute("font-size", "18");
            placeholder.setAttribute("font-family", "monospace");
            placeholder.textContent = "Field Visualization Area";
            svg.appendChild(placeholder);
        }

        // Initialize with default text
        setTimeout(() => {
            processText();
        }, 500);
    </script>
</body>
</html>
