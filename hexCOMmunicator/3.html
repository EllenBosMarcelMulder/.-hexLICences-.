<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hex // HARDENED AXIOMS</title>
    <style>
        :root { --bg: #000; }
        body {
            background: var(--bg);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }
        hex-frame {
            display: block;
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        hex-plasma {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        hex-plasma[layer="audio"] { display: none; }
        #io-port { position: absolute; top: -1000px; opacity: 0; }
        #osd {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-family: monospace;
            color: #444;
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <hex-frame>
        <hex-plasma layer="glyph"></hex-plasma>
        <hex-plasma layer="visual"></hex-plasma>
        <hex-plasma layer="audio"></hex-plasma>
    </hex-frame>

    <div id="osd">AXIOM: ΣE=1 // STRESS OBSERVABLE // VECTOR INJECTION</div>
    <input type="text" id="io-port" autocomplete="off">

<script>
    const N = 18;

    /**
     * I. DE WAARHEID (FIELD OBJECT)
     * Nu met Stress als expliciete observabele.
     */
    const FIELD = {
        E:    new Float32Array(N).fill(1/N), // Start in perfect evenwicht (1.0 totaal)
        Phi:  new Float32Array(N).map((_, i) => i * (Math.PI / 9)),
        Stress: 0.0,               // Nieuw: Afgeleide grootheid (1 - Integrity)
        Integrity: 1.0,            // Stabiliteit
        Time: 0
    };

    let AC = null;
    let NODES = [];
    let ANCHOR = null;

    /**
     * II. DE WET (FIELD EVOLUTION)
     * Axiomatische handhaving.
     */
    function evolve() {
        // A. Fysica (Diffusie & Transport)
        for(let i=0; i<N; i++) {
            // Fase rotatie o.b.v. lokale energie
            FIELD.Phi[i] += 0.02 + (FIELD.E[i] * 0.1);
        }

        // Transport (Flux langs gradiënten)
        // We gebruiken een temp buffer om energiebehoud tijdens de stap te garanderen
        const nextE = new Float32Array(FIELD.E);
        
        for(let i=0; i<N; i++) {
            const neighbor = (i + 1) % N;
            const dPhi = Math.abs(FIELD.Phi[i] - FIELD.Phi[neighbor]);
            
            // Flux: Stroomt van hoog naar laag, gemoduleerd door fasespanning
            if (FIELD.E[i] > FIELD.E[neighbor]) {
                const flow = (FIELD.E[i] - FIELD.E[neighbor]) * (dPhi * 0.05);
                nextE[i] -= flow;
                nextE[neighbor] += flow;
            }
        }
        FIELD.E.set(nextE);

        // B. AXIOMA 1: NORMALISATIE (Expliciet Afdwingen)
        // ΣE moet 1.0 zijn. Altijd.
        let norm = 0;
        for (let i = 0; i < N; i++) norm += FIELD.E[i];
        
        if (norm > 0.0001) { // Voorkom divide-by-zero bij koude start
             for (let i = 0; i < N; i++) FIELD.E[i] /= norm;
        } else {
             // Fallback bij dood systeem: herstel naar evenwicht
             for (let i = 0; i < N; i++) FIELD.E[i] = 1/N;
        }

        // C. Integriteit Herstel
        FIELD.Integrity += (1.0 - FIELD.Integrity) * 0.01;

        // D. AXIOMA 2: STRESS ALS AFGELEIDE
        // Stress is de inverse van integriteit. Projecties lezen dit.
        FIELD.Stress = 1.0 - FIELD.Integrity;
        
        FIELD.Time++;
    }

    /**
     * III. DE INPUT (GENERIEKE VECTOR)
     * Dit is de universele stekker.
     */
    function injectVector(vector) {
        if(!AC) initAudio();

        // 1. Axiomatische Verstoring
        // Energie toevoegen mag niet (ΣE=1), dus we herverdelen agressief.
        // We verstoren de Integriteit (wat Stress veroorzaakt).
        FIELD.Integrity *= 0.5; 

        // 2. Vector Mapping
        // De vector bepaalt WAAR de energie zich concentreert (lokale pieken).
        for(let i=0; i<N; i++) {
            if(vector[i] > 0) {
                FIELD.E[i] += vector[i] * 0.5; // Voeg lokaal toe
                FIELD.Phi[i] += Math.PI/2;     // Torsie
            }
        }
        
        // (De normalisatie-stap in de volgende evolve() zal het totaal weer rechttrekken naar 1.0,
        // waardoor de injectie resulteert in een scherpe herverdeling ipv toename).
    }

    /**
     * IV. DE DRIVER (ascPi IMPLEMENTATIE)
     * Vertaalt ASCII naar Vector.
     */
    function ascPi_seed(char) {
        const code = char.charCodeAt(0);
        const vector = new Float32Array(N).fill(0);
        
        // Bitwise mapping naar vectorruimte
        for(let i=0; i<8; i++) {
            if ((code >> i) & 1) {
                const target = (code + i * 3) % N;
                vector[target] = 1.0; // Binaire activatie
            }
        }
        
        injectVector(vector);
    }

    /**
     * V. DE PROJECTIE (RENDERERS)
     */
    const RENDERERS = {
        visual: (ctx, w, h) => {
            // Wis iets minder hard voor 'trail' effect
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; 
            ctx.fillRect(0, 0, w, h);
            
            const cx = w/2, cy = h/2;
            const baseR = 150;

            ctx.beginPath();
            // Kleur reageert op Stress (Groen -> Wit/Rood)
            const hue = 120 - (FIELD.Stress * 120); 
            ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
            
            // Dikte reageert op lokale energiedichtheid
            for(let i=0; i<N; i++) {
                // Radius = Base + Energie (uitstulping) - Stress (compressie)
                const r = baseR + (FIELD.E[i] * 800) - (FIELD.Stress * 50);
                const a = FIELD.Phi[i];
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r;
                
                if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        },

        glyph: (ctx, w, h) => {
            // Geheugenlaag: Tekent alleen pieken (Filamenten)
            const cx = w/2, cy = h/2;
            const baseR = 150;
            
            ctx.fillStyle = `rgba(0, 255, 128, 0.15)`;
            
            for(let i=0; i<N; i++) {
                // Alleen energiepieken boven het gemiddelde (1/18 ≈ 0.055) tekenen
                if(FIELD.E[i] > 0.1) {
                     const r = baseR + (FIELD.E[i] * 800) - (FIELD.Stress * 50);
                     const a = FIELD.Phi[i];
                     const x = cx + Math.cos(a) * r;
                     const y = cy + Math.sin(a) * r;
                     ctx.fillRect(x, y, 2, 2);
                }
            }
        },

        audio: () => {
            if(!AC) return;
            
            // ANCHOR reageert op STRESS
            // Hoge stress = Hoge druk = Diepere/Harde Rumble
            const anchorVol = FIELD.Stress * 0.4;
            ANCHOR.gain.setTargetAtTime(anchorVol, AC.currentTime, 0.05);

            // SWIRL reageert op LOKALE E
            for(let i=0; i<N; i++) {
                if(NODES[i]) {
                    // Frequentie verschuift door fase-torsie
                    const freq = 100 + (i * 12) + (FIELD.E[i] * 500);
                    // Volume is puur de lokale energiedichtheid
                    // Omdat ΣE=1, is het totale volume constant, maar de verdeling verschuift
                    const vol = FIELD.E[i]; 
                    
                    NODES[i].osc.frequency.setTargetAtTime(freq, AC.currentTime, 0.05);
                    NODES[i].gain.gain.setTargetAtTime(vol, AC.currentTime, 0.05);
                }
            }
        }
    };

    // --- DOM COMPONENT ---
    class HexPlasmaElement extends HTMLElement {
        constructor() {
            super();
            this.layerType = this.getAttribute('layer');
            if(this.layerType !== 'audio') {
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.appendChild(this.canvas);
            }
        }
        connectedCallback() {
            if(this.canvas) {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
        }
        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
        render() {
            if(this.layerType === 'audio') RENDERERS.audio();
            else RENDERERS[this.layerType](this.ctx, this.canvas.width, this.canvas.height);
        }
    }
    customElements.define('hex-plasma', HexPlasmaElement);

    // --- SETUP ---
    function initAudio() {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        const master = AC.createGain();
        master.gain.value = 0.5; // Iets harder omdat E genormaliseerd is
        master.connect(AC.destination);

        // 1. Swirl Nodes
        for(let i=0; i<N; i++) {
            const o = AC.createOscillator();
            const g = AC.createGain();
            o.start();
            o.connect(g).connect(master);
            g.gain.value = 0;
            NODES.push({osc: o, gain: g});
        }

        // 2. Stress Anchor (Rumble)
        const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
        
        const noise = AC.createBufferSource();
        noise.buffer = buf;
        noise.loop = true;
        
        const lpf = AC.createBiquadFilter();
        lpf.type = 'lowpass';
        lpf.frequency.value = 60;
        
        ANCHOR = AC.createGain();
        ANCHOR.gain.value = 0;
        
        noise.connect(lpf).connect(ANCHOR).connect(master);
        noise.start();
    }

    const layers = document.querySelectorAll('hex-plasma');
    function loop() {
        evolve();
        layers.forEach(l => l.render());
        requestAnimationFrame(loop);
    }
    
    const port = document.getElementById('io-port');
    document.addEventListener('click', () => { port.focus(); if(!AC) initAudio(); });
    document.addEventListener('mousemove', () => port.focus());
    
    port.addEventListener('keydown', e => {
        if(e.repeat) return;
        ascPi_seed(e.key);
        setTimeout(() => port.value = '', 0);
    });

    loop();

</script>
</body>
</html>
