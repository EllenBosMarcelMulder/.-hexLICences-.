<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>hex // CAMERA TRANSDUCER</title>
    <style>
        :root { --bg: #000; }
        body {
            background: var(--bg);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            font-family: monospace;
            color: #444;
        }

        hex-frame {
            display: block;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        hex-plasma {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        hex-plasma[layer="audio"] { display: none; }

        /* DE WAARHEID: DE CAMERA BESTAAT, MAAR IS ONZICHTBAAR */
        #sensor-feed {
            position: absolute;
            top: -10000px;
            left: -10000px;
            opacity: 0;
            pointer-events: none;
        }

        #osd {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <hex-frame>
        <hex-plasma layer="glyph"></hex-plasma>
        <hex-plasma layer="visual"></hex-plasma>
        <hex-plasma layer="cursor"></hex-plasma>
        <hex-plasma layer="audio"></hex-plasma>
    </hex-frame>

    <div id="osd">
        hexFIELD + SENSOR // PHOTONIC INJECTION // CLICK TO ENGAGE
    </div>
    
    <video id="sensor-feed" autoplay playsinline></video>
    <canvas id="sensor-proc" width="6" height="3" style="display:none;"></canvas>

<script>
    /**
     * hexFIELD + CAMERA TRANSDUCER
     * ----------------------------
     * Axiom: Light = Pressure
     * Axiom: Movement = Stress
     * No Image Rendering. Only Field Perturbation.
     */

    const N = 18;

    // --- I. DE STATUS (FIELD) ---
    const FIELD = {
        E:         new Float32Array(N).fill(1/N), 
        Phi:       new Float32Array(N).map((_, i) => i * (Math.PI / 9)),
        Stress:    0.0,
        Integrity: 1.0,
        Time:      0,
        Cursor:    { x: window.innerWidth/2, y: window.innerHeight/2 },
        Target:    { x: window.innerWidth/2, y: window.innerHeight/2 }
    };

    let AC = null;
    let NODES = [];
    let ANCHOR = null;
    let CAMERA_ACTIVE = false;

    // --- II. DE SENSOR (CAMERA LOGIC) ---
    // Vertaalt pixels naar energie-vectoren.
    const SENSOR = {
        video: document.getElementById('sensor-feed'),
        canvas: document.getElementById('sensor-proc'),
        ctx: null,
        
        init: async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 320, height: 240, frameRate: 30 } 
                });
                this.video.srcObject = stream;
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                CAMERA_ACTIVE = true;
                this.loop();
            } catch(e) {
                console.warn("SENSOR FAILURE: No Camera Access", e);
            }
        },

        loop: function() {
            if(!CAMERA_ACTIVE) return;
            
            // 1. Downsample Realiteit naar 3x6 Grid (18 sectoren)
            // Dit is de Spatial Isomorphism stap.
            this.ctx.drawImage(this.video, 0, 0, 6, 3);
            
            // 2. Lees Fotonen Data
            const frame = this.ctx.getImageData(0, 0, 6, 3).data;
            const vector = new Float32Array(N);
            let totalLum = 0;
            let maxLum = 0;

            // 3. Map Grid naar Vector
            // Grid 6 breed, 3 hoog = 18 cellen.
            for(let i=0; i<18; i++) {
                const r = frame[i*4];
                const g = frame[i*4+1];
                const b = frame[i*4+2];
                
                // Luminantie = Energie
                // Normaliseer naar 0..1
                const lum = (r + g + b) / (3 * 255);
                
                // Mapping: We mappen de 2D camera-ruimte naar de 1D cirkel-ruimte
                // Links-boven = Sector 0, Rechts-onder = Sector 17
                vector[i] = lum;
                
                totalLum += lum;
                if(lum > maxLum) maxLum = lum;
            }

            // 4. BEWEGINGSDETECTIE (Stress Injectie)
            // Als er veel licht is, of snelle verandering, stijgt de energie
            if(maxLum > 0.1) {
                injectRaw(vector, totalLum / 18);
            }

            requestAnimationFrame(() => this.loop());
        }
    };

    // --- III. DE WET (EVOLUTION) ---
    function evolve() {
        // A. FYSICA
        for(let i=0; i<N; i++) FIELD.Phi[i] += 0.02 + (FIELD.E[i] * 0.1);

        const nextE = new Float32Array(FIELD.E);
        for(let i=0; i<N; i++) {
            const neighbor = (i + 1) % N;
            const dPhi = Math.abs(FIELD.Phi[i] - FIELD.Phi[neighbor]);
            if (FIELD.E[i] > FIELD.E[neighbor]) {
                const flow = (FIELD.E[i] - FIELD.E[neighbor]) * (dPhi * 0.05);
                nextE[i] -= flow;
                nextE[neighbor] += flow;
            }
        }
        FIELD.E.set(nextE);

        // B. NORMALISATIE
        let norm = 0;
        for (let i = 0; i < N; i++) norm += FIELD.E[i];
        if (norm > 0.0001) for (let i = 0; i < N; i++) FIELD.E[i] /= norm;
        else for (let i = 0; i < N; i++) FIELD.E[i] = 1/N;

        // C. INTEGRITEIT
        FIELD.Integrity += (1.0 - FIELD.Integrity) * 0.02;
        FIELD.Stress = 1.0 - FIELD.Integrity;
        
        // D. HAPTICS (Cursor)
        const friction = 0.2 * FIELD.Integrity;
        FIELD.Cursor.x += (FIELD.Target.x - FIELD.Cursor.x) * friction;
        FIELD.Cursor.y += (FIELD.Target.y - FIELD.Cursor.y) * friction;

        FIELD.Time++;
    }

    // --- IV. INJECTION LOGIC ---
    
    // Nieuw: Raw Injection voor continue streams (zoals camera)
    function injectRaw(vector, intensity) {
        if(!AC) return; // Wacht op audio init

        // Camera input is constant, dus we injecteren subtieler dan toetsaanslagen
        // We duwen tegen het veld.
        
        // Als input intens is, breekt de integriteit (Stress stijgt)
        if(intensity > 0.3) {
            FIELD.Integrity *= 0.95; 
        }

        for(let i=0; i<N; i++) {
            // Voeg energie toe waar licht is
            if(vector[i] > 0.1) {
                // De camera 'verwarmt' specifieke sectoren
                FIELD.E[i] += vector[i] * 0.05; 
                // Licht veroorzaakt torsie (fase-verschuiving)
                FIELD.Phi[i] += vector[i] * 0.1; 
            }
        }
    }

    // --- V. PROJECTIES (RENDERERS) ---
    const RENDERERS = {
        visual: (ctx, w, h) => {
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, w, h);
            const cx = FIELD.Cursor.x, cy = FIELD.Cursor.y;
            const baseR = 150;

            ctx.beginPath();
            const hue = 120 - (FIELD.Stress * 120);
            ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
            
            for(let i=0; i<N; i++) {
                const r = baseR + (FIELD.E[i] * 800) - (FIELD.Stress * 50);
                const a = FIELD.Phi[i];
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r;
                if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        },

        glyph: (ctx, w, h) => {
            // Geheugenlaag roteert met de tijd
            const cx = w/2, cy = h/2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(FIELD.Time * 0.0005); 
            ctx.translate(-cx, -cy);

            ctx.fillStyle = `rgba(0, 255, 128, 0.15)`;
            const baseR = 150;
            
            for(let i=0; i<N; i++) {
                if(FIELD.E[i] > 0.15) { // Alleen bij significante excitatie
                     const r = baseR + (FIELD.E[i] * 800);
                     const a = FIELD.Phi[i];
                     const x = cx + Math.cos(a) * r;
                     const y = cy + Math.sin(a) * r;
                     ctx.fillRect(x, y, 2, 2);
                }
            }
            ctx.restore();
        },

        cursor: (ctx, w, h) => {
            ctx.clearRect(0,0,w,h);
            const x = FIELD.Cursor.x, y = FIELD.Cursor.y;
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + FIELD.Stress})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
            ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
            ctx.stroke();
        },

        audio: () => {
            if(!AC) return;
            const anchorVol = FIELD.Stress * 0.4;
            ANCHOR.gain.setTargetAtTime(anchorVol, AC.currentTime, 0.05);

            for(let i=0; i<N; i++) {
                if(NODES[i]) {
                    const freq = 100 + (i * 12) + (FIELD.E[i] * 600);
                    const vol = FIELD.E[i]; 
                    NODES[i].osc.frequency.setTargetAtTime(freq, AC.currentTime, 0.05);
                    NODES[i].gain.gain.setTargetAtTime(vol, AC.currentTime, 0.05);
                }
            }
        }
    };

    // --- VI. DOM FRAME ---
    class HexPlasmaElement extends HTMLElement {
        constructor() {
            super();
            this.layerType = this.getAttribute('layer');
            if(this.layerType !== 'audio') {
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.appendChild(this.canvas);
            }
        }
        connectedCallback() {
            if(this.canvas) {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
        }
        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }
        render() {
            if(this.layerType === 'audio') RENDERERS.audio();
            else RENDERERS[this.layerType](this.ctx, this.canvas.width, this.canvas.height);
        }
    }
    customElements.define('hex-plasma', HexPlasmaElement);

    // --- SETUP ---
    function initAudio() {
        if(AC) return;
        AC = new (window.AudioContext || window.webkitAudioContext)();
        const master = AC.createGain();
        master.gain.value = 0.5; 
        master.connect(AC.destination);

        for(let i=0; i<N; i++) {
            const o = AC.createOscillator();
            const g = AC.createGain();
            o.start(); o.connect(g).connect(master);
            g.gain.value = 0; NODES.push({osc: o, gain: g});
        }

        const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
        const noise = AC.createBufferSource();
        noise.buffer = buf; noise.loop = true;
        const lpf = AC.createBiquadFilter();
        lpf.type = 'lowpass'; lpf.frequency.value = 60;
        ANCHOR = AC.createGain(); ANCHOR.gain.value = 0;
        noise.connect(lpf).connect(ANCHOR).connect(master); noise.start();
        
        // Start Camera
        SENSOR.init();
    }

    const layers = document.querySelectorAll('hex-plasma');
    function loop() {
        evolve();
        layers.forEach(l => l.render());
        requestAnimationFrame(loop);
    }
    
    document.addEventListener('mousemove', e => {
        FIELD.Target.x = e.clientX;
        FIELD.Target.y = e.clientY;
        if(FIELD.Time < 10) { FIELD.Cursor.x = e.clientX; FIELD.Cursor.y = e.clientY; }
    });

    document.addEventListener('click', () => { if(!AC) initAudio(); });

    loop();

</script>
</body>
</html>
